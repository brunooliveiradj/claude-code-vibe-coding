<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Inbox — Prévia</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #12110F;
  --surface: #1A1916;
  --card-hover: #1C1A17;
  --border: #2E2B26;
  --text: #EDE9E3;
  --muted: #7D7872;
  --faint: #4A4642;
  --dim: #3A3630;
  --alta: #FF5252;
  --media: #F5A623;
  --lixo: #5A5551;
  --blue: #5EADF7;
  --green: #34D399;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

body { display: flex; flex-direction: column; overflow: hidden; }

/* ── HEADER ─────────────────────────────── */
.header {
  display: flex; align-items: center; gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo {
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.logo em { color: var(--blue); font-style: normal; }
.header-info { font-size: 11px; font-family: var(--mono); color: var(--faint); }

.precision {
  display: flex; align-items: center; gap: 6px;
  background: rgba(52,211,153,0.08);
  border: 1px solid rgba(52,211,153,0.25);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; font-family: var(--mono); color: var(--green);
  font-variant-numeric: tabular-nums;
}
.precision-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

.btn-refresh {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: 6px 14px; border-radius: 6px;
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.btn-refresh:hover { color: var(--text); border-color: var(--blue); }
.btn-refresh .spin { display: inline-block; }
.btn-refresh.loading .spin { animation: rot 0.8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* ── STATS BAR ──────────────────────────── */
.stats {
  display: flex; align-items: center;
  height: 36px; padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; font-size: 12px;
}
.stat { display: flex; align-items: center; gap: 7px; }
.stat-count {
  font-family: var(--mono); font-weight: 700; font-size: 11px;
  padding: 1px 7px; border-radius: 4px;
  font-variant-numeric: tabular-nums;
}
.stat-sep { width: 1px; height: 14px; background: var(--border); margin: 0 14px; }
.stat-label { color: var(--muted); }
.stats-total { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); }

/* ── MAIN ───────────────────────────────── */
.main { position: relative; flex: 1; overflow-y: auto; padding: 18px 20px; min-height: 0; }
.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* loading overlay durante a atualização */
.veil {
  position: absolute; inset: 0; z-index: 50;
  background: rgba(18,17,15,0.74); backdrop-filter: blur(2px);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
}
.veil.show { display: flex; }
.veil-spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--blue);
  animation: rot 0.75s linear infinite;
}
.veil-text { font-size: 12px; font-family: var(--mono); color: var(--muted); }

@keyframes fadein { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
.main.flash .card, .main.flash .lixo-row { animation: fadein 0.4s ease both; }

.columns {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  margin-bottom: 20px;
}
@media (max-width: 900px) { .columns { grid-template-columns: 1fr; } }

/* column */
.col { min-width: 0; }
.col-head {
  display: flex; align-items: flex-end; gap: 10px;
  padding: 10px 0 10px; margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.col-alta .col-head { border-top: 2px solid var(--alta); }
.col-media .col-head { border-top: 2px solid var(--media); }
.col-num {
  font-family: var(--mono); font-size: 38px; font-weight: 800;
  line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.col-alta .col-num { color: var(--alta); }
.col-media .col-num { color: var(--media); }
.col-name {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em;
  font-weight: 700; color: var(--muted); line-height: 1.2;
}
.col-hint { font-size: 10px; color: var(--faint); }

/* ── CARD ───────────────────────────────── */
.card {
  position: relative; padding: 9px 10px 9px 14px;
  border-radius: 6px; margin-bottom: 2px;
  transition: background 0.12s, opacity 0.3s;
}
.card::before {
  content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 1px; opacity: 0.6;
}
.col-alta .card::before { background: var(--alta); }
.col-media .card::before { background: var(--media); }
.card:hover { background: var(--card-hover); }
.card.done { opacity: 0.3; pointer-events: none; }

.card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.avatar {
  width: 19px; height: 19px; border-radius: 50%;
  font-size: 9px; font-weight: 800; color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.sender { font-size: 11px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.date { font-size: 10px; font-family: var(--mono); color: var(--faint); flex-shrink: 0; }
.subject {
  font-size: 13px; font-weight: 500; line-height: 1.35;
  margin-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.snippet { font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* feedback row */
.actions {
  display: flex; gap: 5px; margin-top: 7px;
  opacity: 0; transition: opacity 0.12s; pointer-events: none;
}
.card:hover .actions { opacity: 1; pointer-events: auto; }
.act {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--muted); font-size: 11px; padding: 2px 9px;
  border-radius: 4px; cursor: pointer; font-family: inherit;
  transition: all 0.1s; line-height: 1.6;
}
.act.ok:hover { color: var(--green); border-color: rgba(52,211,153,0.4); background: rgba(52,211,153,0.07); }
.act.ng:hover { color: var(--alta); border-color: rgba(255,82,82,0.35); background: rgba(255,82,82,0.07); }

.menu-wrap { position: relative; }
.menu {
  position: absolute; bottom: calc(100% + 4px); left: 0;
  background: #201E1A; border: 1px solid #3A3630; border-radius: 7px;
  padding: 4px; min-width: 150px; z-index: 30;
  box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  display: none;
}
.menu.open { display: block; }
.menu-label { font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; padding: 3px 9px 4px; }
.menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 9px; border-radius: 4px; cursor: pointer;
  font-size: 12px; color: var(--muted); transition: all 0.1s;
}
.menu-item:hover { background: var(--card-hover); color: var(--text); }
.mi-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ── LIXO SECTION ───────────────────────── */
.lixo-section { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.lixo-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.lixo-num {
  font-family: var(--mono); font-size: 26px; font-weight: 800;
  color: var(--lixo); line-height: 1; font-variant-numeric: tabular-nums;
}
.lixo-title-name { font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; font-weight: 700; color: var(--muted); }
.lixo-title-hint { font-size: 10px; color: var(--faint); }

.btn-bulk {
  margin-left: auto;
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: 6px 14px; border-radius: 6px;
  font-size: 12px; cursor: pointer; font-family: inherit;
  transition: all 0.15s; white-space: nowrap;
}
.btn-bulk:hover { color: var(--text); border-color: var(--lixo); background: rgba(90,85,81,0.12); }
.btn-bulk:disabled { opacity: 0.3; cursor: default; }

.checkbox {
  width: 15px; height: 15px; border-radius: 4px;
  border: 1px solid var(--dim); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--text); line-height: 1;
  transition: all 0.1s; background: none; font-family: inherit;
  padding: 0;
}
.checkbox.on { background: var(--lixo); border-color: var(--lixo); }

.lixo-row {
  display: flex; align-items: center; gap: 11px;
  padding: 8px 16px;
  border-bottom: 1px solid #1E1C19;
  transition: background 0.1s, opacity 0.35s, transform 0.35s;
}
.lixo-row:last-child { border-bottom: none; }
.lixo-row:hover { background: var(--card-hover); }
.lixo-row.selected { background: rgba(90,85,81,0.09); }
.lixo-row.leaving { opacity: 0; transform: translateX(24px); }
.lr-sender { font-size: 11px; color: var(--faint); width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-subject { font-size: 12px; color: #6B6560; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.lr-date { font-size: 10px; font-family: var(--mono); color: var(--dim); flex-shrink: 0; }
.lr-moves { display: flex; gap: 4px; opacity: 0; transition: opacity 0.12s; flex-shrink: 0; }
.lixo-row:hover .lr-moves { opacity: 1; }
.lr-move {
  background: none; border: 1px solid var(--border);
  color: var(--muted); font-size: 10px; padding: 2px 8px;
  border-radius: 4px; cursor: pointer; font-family: inherit; transition: all 0.1s;
}
.lr-move.to-alta:hover { color: var(--alta); border-color: rgba(255,82,82,0.4); }
.lr-move.to-media:hover { color: var(--media); border-color: rgba(245,166,35,0.4); }

.empty { text-align: center; padding: 28px; font-size: 12px; color: var(--dim); }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #22201C; border: 1px solid #3A3630; border-radius: 8px;
  padding: 10px 18px; font-size: 12.5px; color: var(--text);
  box-shadow: 0 12px 32px rgba(0,0,0,0.5); z-index: 100;
  transition: transform 0.25s ease;
}
.toast.show { transform: translateX(-50%) translateY(0); }

.preview-tag {
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--bg); background: var(--blue);
  padding: 2px 7px; border-radius: 3px; font-weight: 800;
}
</style>
</head>

  document.getElementById('prec').textContent = fbTotal === 0 ? '—' : Math.round(fbCorrect / fbTotal * 100) + '%';
  const bulk = document.getElementById('bulkBtn');
  bulk.textContent = selected.size > 0 ? `Marcar ${selected.size} como lido` : 'Marcar todos como lido';
  bulk.disabled = DATA.lixo.length === 0;
}

function cardHTML(e, cat) {
  const others = ['alta','media','lixo'].filter(c => c !== cat);
  return `
  <div class="card" id="card-${e.id}">
    <div class="card-top">
      <span class="avatar" style="background:${avColor(e.sender)}">${esc(e.sender.charAt(0).toUpperCase())}</span>
      <span class="sender">${esc(e.sender)}</span>
      <span class="date">${esc(e.date)}</span>
    </div>
    <div class="subject">${esc(e.subject)}</div>
    ${e.snippet ? `<div class="snippet">${esc(e.snippet)}</div>` : ''}
    <div class="actions">
      <button class="act ok" onclick="confirmCard('${e.id}')">👍 Correto</button>
      <div class="menu-wrap">
        <button class="act ng" onclick="toggleMenu(event,'${e.id}')">👎 Errado</button>
        <div class="menu" id="menu-${e.id}">
          <div class="menu-label">Mover para</div>
          ${others.map(c => `<div class="menu-item" onclick="moveCard('${e.id}','${cat}','${c}')"><span class="mi-dot" style="background:${CAT_COLOR[c]}"></span>${CAT_LABEL[c]}</div>`).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function lixoRowHTML(e) {
  return `
  <div class="lixo-row ${selected.has(e.id) ? 'selected' : ''}" id="row-${e.id}">
    <button class="checkbox ${selected.has(e.id) ? 'on' : ''}" onclick="toggleSel('${e.id}')">${selected.has(e.id) ? '✓' : ''}</button>
    <span class="lr-sender">${esc(e.sender)}</span>
    <span class="lr-subject">${esc(e.subject)}</span>
    <span class="lr-date">${esc(e.date)}</span>
    <span class="lr-moves">
      <button class="lr-move to-alta" onclick="moveCard('${e.id}','lixo','alta')">→ Alta</button>
      <button class="lr-move to-media" onclick="moveCard('${e.id}','lixo','media')">→ Média</button>
    </span>
  </div>`;
}

function render() {
  document.getElementById('list-alta').innerHTML =
    DATA.alta.length ? DATA.alta.map(e => cardHTML(e, 'alta')).join('') : '<div class="empty">Nenhum email aqui.</div>';
  document.getElementById('list-media').innerHTML =
    DATA.media.length ? DATA.media.map(e => cardHTML(e, 'media')).join('') : '<div class="empty">Nenhum email aqui.</div>';
  document.getElementById('list-lixo').innerHTML =
    DATA.lixo.length ? DATA.lixo.map(lixoRowHTML).join('') : '<div class="empty">Lixo zerado — caixa limpa ✨</div>';
  const cbAll = document.getElementById('cbAll');
  const all = DATA.lixo.length > 0 && selected.size === DATA.lixo.length;
  cbAll.classList.toggle('on', all);
  cbAll.textContent = all ? '✓' : '';
  updateCounters();
}

// ── ações ──
function confirmCard(id) {
  fbTotal++; fbCorrect++;
  const el = document.getElementById('card-' + id);
  if (el) el.classList.add('done');
  updateCounters();
  toast('Feedback salvo: classificação confirmada 👍');
}

function toggleMenu(ev, id) {
  ev.stopPropagation();
  closeMenus();
  document.getElementById('menu-' + id)?.classList.toggle('open');
}
function closeMenus() {
  document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
}
document.addEventListener('click', e => { if (!e.target.closest('.menu-wrap')) closeMenus(); });

function moveCard(id, from, to) {
  const idx = DATA[from].findIndex(e => e.id === id);
  if (idx === -1) return;
  const [e] = DATA[from].splice(idx, 1);
  DATA[to].unshift(e);
  selected.delete(id);
  fbTotal++;
  render();
  toast(`Movido para ${CAT_LABEL[to]} — o sistema aprende com isso 🧠`);
}

function toggleSel(id) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  render();
}
function toggleAll() {
  if (selected.size === DATA.lixo.length) selected.clear();
  else DATA.lixo.forEach(e => selected.add(e.id));
  render();
}

function bulkMarkRead() {
  const ids = selected.size > 0 ? [...selected] : DATA.lixo.map(e => e.id);
  ids.forEach(id => document.getElementById('row-' + id)?.classList.add('leaving'));
  setTimeout(() => {
    DATA.lixo = DATA.lixo.filter(e => !ids.includes(e.id));
    selected.clear();
    render();
    const n = ids.length;
    toast(`Prévia: ${n} email${n > 1 ? 's somem' : ' some'} só da tela. Na versão conectada, isso remove o marcador "não lida" no seu Gmail de verdade.`);
  }, 350);
}

function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  const veil = document.getElementById('veil');
  const veilText = document.getElementById('veilText');
  const info = document.getElementById('info');
  const main = document.querySelector('.main');

  btn.classList.add('loading');
  btn.disabled = true;
  veil.classList.add('show');
  veilText.textContent = 'Buscando não lidos no Gmail…';
  info.textContent = 'buscando não lidos…';

  setTimeout(() => {
    veilText.textContent = 'Classificando 40 emails com Claude…';
    info.textContent = 'classificando com Claude…';
    setTimeout(() => {
      veil.classList.remove('show');
      btn.classList.remove('loading');
      btn.disabled = false;
      info.textContent = '40 não lidos · reclassificado agora';
      // repaint visível: os cards fazem fade-in de novo
      main.classList.add('flash');
      render();
      setTimeout(() => main.classList.remove('flash'), 500);
      toast('Prévia: os dados são fixos, então a lista não muda. Na versão conectada isso busca o Gmail e reclassifica via Claude API.');
    }, 1300);
  }, 1000);
}

render();
</script>
</body>
</html>
